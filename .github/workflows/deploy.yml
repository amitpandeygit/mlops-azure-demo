name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Set the variable ACR_LOGIN_SERVER to your registry, for example mlopsdemo123.azurecr.io
  IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/mlops-azure-demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1 Sign in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 2 Build the image (it trains the model and checks the quality gate)
        run: docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .

      - name: 3 Push the image (then click Restart on the container instance to load it)
        run: docker push --all-tags $IMAGE
